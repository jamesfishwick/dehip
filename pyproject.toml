[project]
name = "dehip"
version = "0.1.0"
description = "HIP cascade and evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "openai",
    "numpy",
    "scipy",
    "pyarrow",
    "pyyaml",
]

[project.scripts]
dehip = "dehip.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dehip"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
