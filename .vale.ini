StylesPath = styles
MinAlertLevel = suggestion
Vocab = dehip

# Registry packages resolve by bare name; community packages need a full
# release-zip URL. hedgeclipper ships no zip asset, so it is installed by hand
# under styles/hedgeclipper/ (vale sync leaves hand-placed styles alone).
Packages = proselint, write-good, Readability, https://github.com/ChrisChinchilla/Openly/releases/latest/download/Openly.zip, https://github.com/tbhb/vale-ai-tells/releases/latest/download/ai-tells.zip

[*.md]
BasedOnStyles = Vale, proselint, write-good, Readability, Openly, ai-tells, hedgeclipper

# E-Prime flags every form of "to be" — too aggressive for ordinary prose.
write-good.E-Prime = NO
